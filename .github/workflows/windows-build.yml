name: Windows build

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ScreenTimeTracker.sln

      - name: Build
        run: dotnet build ScreenTimeTracker.sln -c Release --no-restore

      - name: Audit vulnerable packages
        run: dotnet list ScreenTimeTracker.csproj package --vulnerable --include-transitive
